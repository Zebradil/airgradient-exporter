pre-commit:
  commands:
    govet:
      glob: '*.go'
      run: go vet ./...
    gofumpt:
      files: git diff --name-only --cached --diff-filter=AM
      glob: '*.go'
      run: gofumpt -l {files} | tee /dev/stderr | test $(wc -l) -eq 0
    golangci-lint:
      glob: '*.go'
      run: golangci-lint run
    goreleaser-config:
      glob: '.goreleaser.*'
      run: task misc:build:goreleaser-config && git add .goreleaser.yml
    generate-dashboard:
      glob: 'dashboard/*'
      run: task dashboard:build && git add dashboard/dashboard.json
commit-msg:
  commands:
    'lint commit message':
      run: commitlint --edit {1}
