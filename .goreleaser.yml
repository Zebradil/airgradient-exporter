version: 2
project_name: airgradient-exporter
before:
  hooks:
  - go mod tidy
builds:
- binary: airgradient-exporter
  env:
  - CGO_ENABLED=0
  targets:
  - linux_amd64
  - linux_arm64
archives:
- name_template: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}'
  format_overrides:
  - goos: windows
    format: zip
  files:
  - LICENSE
  - README.md
  - systemd/*
checksum:
  name_template: checksums.txt
snapshot:
  name_template: '{{ incpatch .Version }}-next'
